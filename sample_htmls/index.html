<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Ripeness Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Fruit Ripeness Detector</h1>
      <p>Upload a video, image, or use your camera to detect fruit ripeness.</p>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="functionality">
        <h2>Detect from Video</h2>
        <div class="upload-box">
          <input type="file" id="video-upload" accept="video/*">
          <label for="video-upload" class="upload-label">Choose a Video</label>
        </div>
      </section>

      <section class="functionality">
        <h2>Detect from Image</h2>
        <div class="upload-box">
          <input type="file" id="image-upload" accept="image/*">
          <label for="image-upload" class="upload-label">Choose an Image</label>
        </div>
      </section>

      <section class="functionality">
        <h2>Detect from Live Camera</h2>
        <button id="camera-btn" class="camera-btn">Open Camera</button>
        <video id="live-camera" autoplay muted style="display: none;"></video>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2023 Fruit Ripeness Detector. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
