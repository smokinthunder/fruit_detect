<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Detection | AI Vision</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="upload-container">
        <div class="upload-header">
            <i class="bi bi-camera-reels"></i>
            <h1>Video Detection</h1>
            <p>Upload a video for AI object detection analysis</p>
        </div>

        <div class="upload-card">
            <form method="POST" enctype="multipart/form-data" class="upload-form">
                <div class="file-upload">
                    <label for="video-upload" class="upload-label">
                        <i class="bi bi-cloud-arrow-up"></i>
                        <span>Choose Video File</span>
                        <input type="file" id="video-upload" name="file" accept="video/*" required>
                    </label>
                    <div class="file-info" id="file-info-video">No file selected</div>
                </div>
                <button type="submit" class="upload-button">
                    <i class="bi bi-magic"></i>
                    Process Video
                </button>
            </form>
        </div>

        {% if result_video %}
        <div class="preview-section">
            <h2><i class="bi bi-check-circle"></i> Processing Complete</h2>
            <div class="preview-container">
                <video controls class="processed-video">
                    <source src="{{ result_video }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="preview-actions">
                    <a href="/upload_video" class="action-button upload">
                        <i class="bi bi-arrow-repeat"></i>
                        Process Another
                    </a>
                    <a href="/" class="action-button home">
                        <i class="bi bi-house-door"></i>
                        Return Home
                    </a>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('video-upload').addEventListener('change', function(e) {
            const fileInfo = document.getElementById('file-info-video');
            if (this.files.length > 0) {
                fileInfo.textContent = this.files[0].name;
            } else {
                fileInfo.textContent = 'No file selected';
            }
        });
    </script>
</body>
</html>
