<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Processing Complete | AI Vision</title>
    <link rel="stylesheet" href="../static/style.css" />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="split-container">
      <!-- Left side - Videos -->
      <div class="video-side">
        <div class="video-comparison">
          <!-- <div class="video-container original">
                    <div class="video-header">
                        <i class="bi bi-file-earmark-play"></i>
                        <h3>Original Video</h3>
                    </div>
                    <video controls>
                        <source src="{{ original_video }}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="video-badge">
                        <span>Original</span>
                    </div>
                </div> -->

          <div class="video-container processed">
            <div class="video-header">
              <i class="bi bi-cpu"></i>
              <h3>Processed Video</h3>
            </div>
            <img
              src="{{ url_for('video')  }}"
              alt="Detection Result"
              class="result-image"
            />

            <!-- <video controls>
                        <source src="{{ processed_video }}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>  -->
            <div class="video-badge ai">
              <span>AI Processed</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right side - Content -->
      <div class="content-side">
        <div class="success-message">
          <div class="icon-wrapper">
            <i class="bi bi-check2-all"></i>
          </div>
          <h1>Video Processing Complete</h1>
          <p>
            Your video has been analyzed with our advanced AI detection system
          </p>
        </div>

        <div class="button-container">
          <a href="/" class="action-button home">
            <i class="bi bi-house-door"></i>
            Return to Home
          </a>
          <a href="/upload_video" class="action-button upload">
            <i class="bi bi-cloud-arrow-up"></i>
            Process Another Video
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
