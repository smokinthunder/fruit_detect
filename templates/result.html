<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Complete | AI Vision</title>
    <link rel="stylesheet" href="../static/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="split-container">
        <!-- Left side - Image -->
        <div class="image-side">
            <div class="result-image-container">
                <img src="{{ result_image }}" alt="Detection Result" class="result-image">
                <div class="image-overlay">
                    <span class="badge">AI Processed</span>
                </div>
            </div>
        </div>
        
        <!-- Right side - Content -->
        <div class="content-side">
            <div class="success-message">
                <div class="icon-wrapper">
                    <i class="bi bi-check2-circle"></i>
                </div>
                <h1>Processing Complete</h1>
                <p>Your image has been analyzed with our advanced AI detection system</p>
            </div>

            <div class="button-container">
                <a href="/" class="action-button home">
                    <i class="bi bi-house-door"></i>
                    Return to Home
                </a>
                <a href="/upload_image" class="action-button upload">
                    <i class="bi bi-cloud-arrow-up"></i>
                    Analyze Another Image
                </a>
            </div>
        </div>
    </div>
</body>
</html>
